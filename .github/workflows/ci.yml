# CI for NGB LOGISTICS
#   checks: typecheck, lint, unit tests, database checks (PGlite), production build, secret scan of the build
#   e2e:    Playwright (mobile + desktop) against the hosted DEV Supabase project
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   Variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (public values; also shipped to browsers)
#   Secret:    E2E_PASSWORD  (password of the fictional seeded test users)
# The service-role key is NOT needed and must never be added here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit + database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database checks (migrations + RLS in PGlite)
        run: npm run test:db
      - run: npm run build
      - name: No server secrets in what browsers download
        run: npm run check:secrets

  e2e:
    name: Playwright (mobile + desktop)
    needs: checks
    # Secrets are not available to pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright (starts the production server itself)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
