<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d3557">
  <title>Offline · NGB LOGISTICS</title>
  <style>
    :root { --bg: #ffffff; --fg: #1d2433; --muted: #5b6475; --primary: #1d3557; --primary-fg: #ffffff; --border: #e3e6ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1a2b; --fg: #e8ecf3; --muted: #a3adbf; --primary: #f4a261; --primary-fg: #1d2433; --border: #24324a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 8px; border: 0;
      background: var(--primary); color: var(--primary-fg); cursor: pointer; min-height: 44px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You&rsquo;re offline</h1>
    <p>Shipment information needs a connection, so it isn&rsquo;t stored on this device. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
